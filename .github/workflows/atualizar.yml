name: Atualizar Radar Fiscal

on:
  schedule:
    # Roda a cada 2 horas, de segunda a sexta
    - cron: '0 */2 * * 1-5'
  workflow_dispatch: # Permite rodar manualmente

# Permissão necessária para o robô salvar o JSON atualizado
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rodar o script de atualização
        env:
          # Puxa a chave que você salvou nos Secrets do repositório
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python atualizar_radar.py --rss

      - name: Commitar e enviar as alterações
        run: |
          git config user.name "Radar Bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add atualizacoes.json
          # Só faz o commit se houver mudanças para evitar erros
          if ! git diff --staged --quiet; then
            git commit -m "chore: atualiza radar via IA"
            git push
          else
            echo "Nenhuma alteração detectada. Pulando commit."
          fi
