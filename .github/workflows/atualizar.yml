name: Atualizar Radar Fiscal

on:
  schedule:
    # Roda a cada 2 horas, de segunda a sexta (horário UTC)
    - cron: '0 */2 * * 1-5'
  workflow_dispatch: # Permite rodar manualmente pelo botão

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rodar o script de atualização
        run: python atualizar_radar.py --rss

      - name: Commitar e enviar as alterações
        run: |
          git config user.name "Radar Bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add atualizacoes.json
          # Só faz o commit se houver mudanças
          git diff --quiet && git diff --staged --quiet || git commit -m "Atualização automática do radar"
          git push
